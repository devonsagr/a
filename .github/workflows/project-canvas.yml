name: Project canvas checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'feat/project-canvas-v1']

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:board
      - run: npm run test:layout
      - run: npm exec -- eslint src/project-canvas src/main.tsx src/legacy-main.tsx vite.config.ts
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
      - name: Browser workflow
        run: npm run test:board:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-canvas-${{ runner.os }}
          path: output/playwright
          if-no-files-found: ignore
